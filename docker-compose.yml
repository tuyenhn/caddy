services:
  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    logging:
      driver: local
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./sites.caddy:/etc/caddy/sites.caddy
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${CADDY_BIND_IP:-0.0.0.0}:80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - proxy

volumes:
  caddy_data:
  caddy_config:

networks:
  proxy:
    external: true
