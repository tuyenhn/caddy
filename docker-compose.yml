services:
  caddy:
    container_name: caddy-reverse-proxy
    image: ghcr.io/tuyenhn/my-caddy:v2.11.2
    restart: unless-stopped
    volumes:
      - ./conf:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config
    ports: 
      - "80:8080"
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}

volumes:
  caddy_data:
  caddy_config:
